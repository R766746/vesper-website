name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch latest release
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/R766746/vesper-website/releases/latest \
            -o release-response.json; then
            jq '{
              tag_name,
              published_at,
              html_url,
              draft,
              prerelease,
              assets: [.assets[] | select(.name == "app-release.apk" or .name == "SHA256SUMS.txt") | {
                name,
                size,
                browser_download_url
              }]
            }' release-response.json > latest-release.json
            rm release-response.json
          else
            printf '%s\n' '{"available":false,"assets":[]}' > latest-release.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
